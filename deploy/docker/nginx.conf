server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads / assets grandes (ícones PWA, bundles)
    client_max_body_size 16M;

    # Cache longo para assets com hash do Metro/Expo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest e service worker sem cache agressivo
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Expo Router static: HTML por rota + fallback SPA
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
